<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Júlio Mesquita — Portfólio em AR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:transparent; }
    #arjs-video, video { object-fit:cover !important; }
    .a-canvas { background:transparent !important; }
    .mindar-ui-overlay { display:none !important; }

    #ui { position:fixed; inset:0; z-index:10; pointer-events:none; }
    #brand { position:absolute; top:14px; left:14px; background:rgba(10,10,12,.5); backdrop-filter:blur(6px);
             border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:9px 13px; color:#fff; }
    #brand h1 { font-size:14px; letter-spacing:.5px; font-weight:700; }
    #brand p  { font-size:11px; opacity:.85; margin-top:2px; }

    #hint { position:absolute; left:50%; bottom:92px; transform:translateX(-50%); text-align:center;
            background:rgba(10,10,12,.6); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.12);
            border-radius:14px; padding:10px 16px; color:#fff; font-size:12.5px; max-width:330px; transition:opacity .4s ease; }
    #hint b { color:#e8c46a; }

    #fixedTop { position:absolute; top:14px; right:14px; display:flex; gap:10px; align-items:center; pointer-events:auto; }
    #siteBtn { background:#e8c46a; color:#0e0e12; font-weight:700; font-size:12.5px; text-decoration:none;
               padding:10px 14px; border-radius:999px; box-shadow:0 2px 10px rgba(0,0,0,.35); white-space:nowrap; }
    #waBtn { width:44px; height:44px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center;
             box-shadow:0 2px 10px rgba(0,0,0,.35); text-decoration:none; }
    #waBtn svg { width:26px; height:26px; display:block; }

    /* Barra de controles — z-index alto pra ficar ACIMA do canvas do AR (senão os cliques não passam) */
    #controls { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20; display:none; gap:8px; align-items:center;
                background:rgba(10,10,12,.66); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.14);
                border-radius:999px; padding:8px 10px; pointer-events:auto; max-width:96vw; }
    #controls button { width:42px; height:42px; border:none; border-radius:50%; background:rgba(255,255,255,.10); color:#fff;
                       font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    #controls button:active { background:rgba(255,255,255,.28); }
    #controls #pcPlay { background:#e8c46a; color:#0e0e12; font-size:19px; }
    #controls .sep { width:1px; height:26px; background:rgba(255,255,255,.18); margin:0 2px; }
  </style>
</head>
<body>

  <div id="ui">
    <div id="brand"><h1>JÚLIO MESQUITA</h1><p>Editor de Vídeo &amp; Criador com IA</p></div>
    <div id="fixedTop">
      <a id="siteBtn" href="https://juliomelore.github.io/julioressureicao/" target="_blank" rel="noopener">Site completo</a>
      <a id="waBtn" href="https://wa.me/5511989531368" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 .8C7.5.8.7 7.7.7 16.1c0 2.8.7 5.4 2 7.7L.6 31.4l7.8-2c2.2 1.2 4.8 1.9 7.5 1.9 8.5 0 15.4-6.9 15.4-15.3S24.5.8 16 .8Zm0 27.9c-2.4 0-4.7-.6-6.7-1.8l-.5-.3-4.6 1.2 1.2-4.5-.3-.5c-1.3-2-2-4.4-2-6.9C3.1 9.1 8.9 3.4 16 3.4c3.4 0 6.6 1.3 9 3.7 2.4 2.4 3.7 5.6 3.7 9 0 7-5.8 12.6-12.7 12.6Zm7.1-9.4c-.4-.2-2.3-1.1-2.6-1.3-.3-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-2.3-1.1-3.8-2-5.3-4.6-.4-.7.4-.6 1.1-2 .1-.2 0-.4 0-.6 0-.2-.9-2.1-1.2-2.9-.3-.7-.6-.6-.9-.6h-.7c-.2 0-.6.1-1 .5-.3.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.3 2.6 4 6.3 5.6 2.3 1 3.2 1.1 4.4.9.7-.1 2.3-.9 2.6-1.9.3-.9.3-1.7.2-1.9-.1-.2-.3-.3-.7-.5Z"/></svg>
      </a>
    </div>
    <div id="hint">Aponte a câmera para o <b>cartão</b> (Portfólio interativo). O vídeo aparece por cima.</div>
  </div>

  <div id="controls">
    <button id="pcPrev" title="Voltar">⏮</button>
    <button id="pcPlay" title="Play/Pause">▶</button>
    <button id="pcNext" title="Próximo">⏭</button>
    <button id="pcSound" title="Som">🔇</button>
    <span class="sep"></span>
    <button id="pcAxis" title="Levantar/deitar a tela">⇅</button>
    <button id="pcMinus" title="Diminuir">−</button>
    <button id="pcPlus" title="Aumentar">+</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 8; warmupTolerance: 3"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

    <a-assets>
      <video id="reel" src="./video_drone.mp4" preload="auto" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Só o vídeo no cartão. #videoWrap é girado/escalado pelos botões. -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-entity id="videoWrap" position="0 0 0" rotation="0 0 0" scale="1 1 1">
        <a-video id="vid" src="#reel" width="0.36" height="0.64" position="0 0 0.001"></a-video>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    var PLAYLIST = ['./video_drone.mp4','./video_rocadeira.mp4','./video_hoverkart.mp4','./showreel.mp4'];
    var idx = 0;
    var reel = document.getElementById('reel');
    var wrap = document.getElementById('videoWrap');
    var elControls = document.getElementById('controls');
    var elPlay = document.getElementById('pcPlay');
    var elSound = document.getElementById('pcSound');

    var BASE_H = 0.64;      // altura do vídeo em escala 1
    var standing = false;   // eixo: false = deitado (no plano do cartão), true = em pé
    var scaleVal = 1.0;

    function applyTransform(){
      wrap.setAttribute('scale', scaleVal + ' ' + scaleVal + ' ' + scaleVal);
      if (standing){
        var lift = (BASE_H * scaleVal) / 2;
        wrap.setAttribute('rotation', '90 0 0');
        wrap.setAttribute('position', '0 0 ' + lift.toFixed(3));
      } else {
        wrap.setAttribute('rotation', '0 0 0');
        wrap.setAttribute('position', '0 0 0');
      }
    }

    function playIndex(n){
      idx = ((n % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
      reel.src = PLAYLIST[idx]; reel.load();
      var p = reel.play(); if (p && p.catch) p.catch(function(){});
      elPlay.textContent = '⏸';
    }
    reel.addEventListener('ended', function(){ playIndex(idx + 1); });

    function togglePlay(){ if (reel.paused){ reel.play().catch(function(){}); elPlay.textContent='⏸'; } else { reel.pause(); elPlay.textContent='▶'; } }
    function toggleSound(){ reel.muted=!reel.muted; elSound.textContent=reel.muted?'🔇':'🔊'; if(!reel.muted){ reel.play().catch(function(){}); elPlay.textContent='⏸'; } }

    function bind(id, fn){ var el=document.getElementById(id);
      el.addEventListener('click', fn);
      el.addEventListener('touchend', function(ev){ ev.preventDefault(); fn(); }, {passive:false});
    }
    bind('pcPrev', function(){ playIndex(idx-1); });
    bind('pcNext', function(){ playIndex(idx+1); });
    bind('pcPlay', togglePlay);
    bind('pcSound', toggleSound);
    bind('pcAxis', function(){ standing=!standing; applyTransform(); });
    bind('pcMinus', function(){ scaleVal=Math.max(0.5, +(scaleVal-0.15).toFixed(2)); applyTransform(); });
    bind('pcPlus', function(){ scaleVal=Math.min(2.6, +(scaleVal+0.15).toFixed(2)); applyTransform(); });

    document.addEventListener('DOMContentLoaded', function(){
      var target = document.getElementById('target');
      var hint = document.getElementById('hint');
      target.addEventListener('targetFound', function(){
        hint.style.opacity='0'; elControls.style.display='flex';
        reel.play().catch(function(){}); elPlay.textContent='⏸';
      });
      target.addEventListener('targetLost', function(){
        hint.style.opacity='1'; elControls.style.display='none'; reel.pause(); elPlay.textContent='▶';
      });
      applyTransform();
      playIndex(0);

      setTimeout(function(){
        var vids = document.querySelectorAll('video');
        var camEl = vids.length>1 ? vids[vids.length-1] : null;
        var ok = camEl && camEl.srcObject && !camEl.paused && camEl.videoWidth>0;
        if(!ok){
          hint.innerHTML = 'Não consegui acessar a <b>câmera</b>. Permita o acesso e recarregue. Se abriu por um app, toque em <b>“Abrir no navegador”</b>.';
          hint.style.opacity='1';
        }
      }, 8000);
    });
  </script>
</body>
</html>
